    About the job Pariveda is a North American-based, employee-owned professional services firm. We provide strategy and technology services across industries. As a mission-driven organization and Certified B Corp, we enable our clients to imagine and do more, whether it’s making next quarter’s goals or navigating the future. From ideas to impact, we help clients get better at what they do to improve people and profits. Learn more about our mission and culture as well as our recruitment process and interview prep. Pariveda is not your average professional services firm. Looking to join a team in San Francisco where you will be challenged and encouraged to grow your career in a supportive, purpose-driven environment? Explore a career with Pariveda, an employee-owned professional services firm that provides strategy and technology services—from idea to impact. We have been named by Glassdoor as a Best Place to Work seven times since 2017 and are currently looking for motivated individuals who are passionate about using technology to solve problems and help others succeed. To learn more about our culture and what you can expect at Pariveda, review our Findamentals – the behaviors that show who we are. You Can Expect To As a Pariveda Consultant, you will work in small teams, collaborating with other Pariveda employees while partnering with clients to solve real business challenges in an agile, people-first way. Grow your career with the support of a dedicated mentor and a clearly defined career path. You will be reviewed every 6 months and eligible for promotion every 12 months. Try new things to develop yourself as a leader. Learn to estimate, gather requirements, develop, test, manage projects, architect and deliver. We do it all! Explore different technologies and develop applications in languages including: Java, .NET, Python, JavaScript, and SQL, Web technologies like React, Redux, Angular, Vue, Mobile technologies including iOS and Android, Cloud technologies like AWS, Azure, Google Cloud, and Data Driven solutions, IoT, Machine Learning, DevOps, and more. Utilize AI strategically to enhance client solutions, incorporating AI tools to streamline development, uncover insights, and accelerate delivery while clearly communicating the value, limitations, and ethical use of AI to clients and stakeholders. Sharpen your professional communication skills. Create and present findings, solutions, and demos to audiences including senior executives and stakeholders. Work within a hybrid model Actively engage in our culture of continuous learning, community service, social gatherings, and personal and professional development. Work with smart, humble, and supportive people. We Look For Passionate technologists with at least 6+ months of full-time software development experience Lifelong learners for a passion for technology Skilled problem solvers with the desire and proven ability to create innovative solutions Flexible and adaptable attitude- Client, teams and technologies will change with each new challenge Future technology leaders- Dynamic individuals energized by fast paced personal and professional growth Professional communicators who can explain and present concepts to technical and non-technical audiences alike Bachelor’s Degree in MIS, Computer Science, Math, Engineering or comparable experience Legally authorized to work for any company in the United States without sponsorship Pariveda Benefits Transparent and Equitable Salary. Comprehensive medical, dental, and vision insurance for you and your family Employer Health Savings Account (HSA) contribution 2% 401(k), vested immediately Company ownership through Employee Stock Ownership Plan (ESOP) Plenty of Paid Time Off – 4 weeks of vacation time, 10 holidays, 1 floating holiday Paid sabbatical after 5 years of service for Principals and above Paid parental leave & breast milk shipping costs reimbursed for work travel Employee Assistance Program (EAP), health concierge, and financial wellness tool Company paid cell phone plan and device stipend Life insurance Short-Term and Long-Term Disability Pariveda Solutions aspires that our employee diversity is representative of the markets in which we serve. Employment decisions are based solely on merit and business needs and not on race, color, religion, sex, sexual orientation, gender, gender identity, gender expression, pregnancy, marital status, national origin, citizenship status (if authorized to work in the country where the job is located), uniform service member, military or veteran status, ancestry, age (over 40), physical or mental disability including HIV or AIDS, medical condition, genetic information, political affiliation, or any other category protected by applicable federal, provincial, or local law. Our commitment to a welcoming, inclusive environment means we embrace applicants from all backgrounds. If you feel you may need an accommodation at any stage of our interview process due to a disability, please contact the Human Resources team at careandsupport@parivedasolutions.com or +1 844-325-2729, select option 3 and then option 1 Human Resources. Compensation Range: $91.8K - $101K
